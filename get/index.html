<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>柿川亭 ポイ活 アプリ始めました。</title>
<meta name="description" content="柿川亭のポイ活アプリ。iPhoneはApp Store、AndroidはWeb版。">
<link rel="icon" href="../assets/icon.png">
<style>
  :root{--ink:#111;--gray:#6b6b6b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff;color:var(--ink)}
  body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:18px 0 40px;overflow:hidden}
  .hero{display:block;width:100%;max-width:100%;height:auto}
  /* ---- ボタン ---- */
  .act{padding:22px 18px 0}
  .btn{display:block;text-align:center;background:#111;color:#fff;text-decoration:none;font-weight:900;font-size:19px;letter-spacing:.04em;padding:18px 16px;border-radius:14px}
  .btn.sub{background:#fff;color:#111;border:2px solid #111;margin-top:10px}
  .hint{margin-top:12px;font-size:13px;color:var(--gray);line-height:1.6;text-align:center}
  .hide{display:none}
  footer{margin-top:34px;padding:0 18px;font-size:11px;color:var(--gray);text-align:center;line-height:1.7}
  footer a{color:var(--gray)}
</style>
</head>
<body>
<div class="wrap">
  <img class="hero" src="card.png" alt="柿川亭 ポイ活 アプリ始めました。">

  <div class="act">
    <div id="ios">
      <a class="btn" href="https://apps.apple.com/jp/app/id6806443112">App Storeで入手</a>
    </div>
    <div id="android">
      <a class="btn" href="../?src=qr">Web版アプリを開く</a>
      <p class="hint">開いたら Chromeの「⋮」→「ホーム画面に追加」でアプリになります</p>
    </div>
    <div id="pc" class="hide">
      <a class="btn" href="https://apps.apple.com/jp/app/id6806443112">iPhone：App Storeで入手</a>
      <a class="btn sub" href="../?src=qr">Android：Web版を開く</a>
    </div>
  </div>

  <footer>株式会社バウ／新潟油そば 柿川亭（長岡本店・仙台連坊店）<br><a href="../privacy.html">プライバシーポリシー</a></footer>
</div>
<script>
(function(){
  var ua = navigator.userAgent || "";
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  var show = function(id, on){ var el = document.getElementById(id); if (el) el.className = on ? "" : "hide"; };
  if (ios) { show("ios", true); show("android", false); show("pc", false); }
  else if (android) { show("ios", false); show("android", true); show("pc", false); }
  else { show("ios", false); show("android", false); show("pc", true); }
})();
</script>
</body>
</html>
