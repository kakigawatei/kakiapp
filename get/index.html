<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>柿川亭アプリ</title>
<meta name="description" content="柿川亭アプリ。来るほどに楽しくなる、油そば体験をあなたに。iPhoneはApp Store、AndroidはWeb版。">
<link rel="icon" href="../assets/icon.png">
<style>
  :root{--cream:#f4efe6;--navy:#1f2f5a;--red:#a63a2a;--ink:#2b241d;--gray:#7a6f63;--line:#e6dccb;--mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);color:var(--ink)}
  body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:14px 16px 40px}
  .logo{display:block;height:64px;margin:6px auto 12px}
  .hero{position:relative;aspect-ratio:16/10.2;border-radius:16px;overflow:hidden;background:#3a2a20 url("../assets/hero_photo.jpg") center right/cover no-repeat;box-shadow:0 6px 16px rgba(58,42,32,.18)}
  .hero .copy{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:#f4efe6;text-shadow:0 1px 6px rgba(0,0,0,.5);max-width:58%}
  .hero .s1{font-size:13px;letter-spacing:.08em;line-height:1.6}
  .hero .s2{font-family:var(--mincho);font-size:30px;font-weight:700;letter-spacing:.04em;margin:6px 0 8px}
  .hero .s3{font-size:12px;line-height:1.8;letter-spacing:.04em}
  .card{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 2px 10px rgba(58,42,32,.06);display:flex;gap:14px;align-items:center}
  .card .ico{width:60px;height:60px;flex:0 0 60px;border-radius:50%;background:#f7f2ea;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .card .ico img{width:100%;height:100%;object-fit:contain;padding:10px}
  .card h2{font-family:var(--mincho);font-size:18px;font-weight:700;letter-spacing:.04em;margin-bottom:3px}
  .card p{font-size:12.5px;color:var(--gray);line-height:1.6}
  .act{margin-top:18px}
  .btn{display:block;text-align:center;background:var(--red);color:#fff;text-decoration:none;font-weight:700;font-size:17px;letter-spacing:.06em;padding:17px 16px;border-radius:12px;box-shadow:0 3px 8px rgba(166,58,42,.25)}
  .btn.sub{background:#fff;color:var(--red);border:1.5px solid var(--red);box-shadow:none;margin-top:10px}
  .hint{margin-top:12px;font-size:12.5px;color:var(--gray);line-height:1.7;text-align:center}
  .hide{display:none}
  footer{margin-top:30px;font-size:11px;color:var(--gray);text-align:center;line-height:1.7}
  footer a{color:var(--gray)}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="../pop/logo.png" alt="新潟油そば 柿川亭">
  <div class="hero">
    <div class="copy"><div class="s1">今日も、<br>最高の一杯を。</div><div class="s2">柿川亭アプリ</div><div class="s3">来るほどに楽しくなる、<br>油そば体験をあなたに。</div></div>
  </div>

  <div class="card"><div class="ico"><img src="../assets/icon_bowl.png" alt=""></div><div><h2>来店でポイント</h2><p>お店で開くだけで、来店ポイントが自動でつきます</p></div></div>
  <div class="card"><div class="ico"><img src="../assets/icon_wheel.png" alt=""></div><div><h2>毎日ルーレット</h2><p>1日1回、無料で回せます</p></div></div>
  <div class="card"><div class="ico"><img src="../assets/icon_lantern.png" alt=""></div><div><h2>来店ガチャ</h2><p>お店に来たら1日1回。ハズレなし</p></div></div>

  <div class="act">
    <div id="ios"><a class="btn" href="https://apps.apple.com/jp/app/id6806443112">App Storeで入手</a></div>
    <div id="android"><a class="btn" href="../?src=qr">Web版アプリを開く</a><p class="hint">開いたら Chromeの「⋮」→「ホーム画面に追加」でアプリになります</p></div>
    <div id="pc" class="hide"><a class="btn" href="https://apps.apple.com/jp/app/id6806443112">iPhone：App Storeで入手</a><a class="btn sub" href="../?src=qr">Android：Web版を開く</a></div>
  </div>

  <footer>株式会社バウ／新潟油そば 柿川亭（長岡本店・仙台連坊店）<br><a href="../privacy.html">プライバシーポリシー</a></footer>
</div>
<script>
(function(){
  var ua = navigator.userAgent || "";
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  var show = function(id, on){ var el = document.getElementById(id); if (el) el.className = on ? "" : "hide"; };
  if (ios) { show("ios", true); show("android", false); show("pc", false); }
  else if (android) { show("ios", false); show("android", true); show("pc", false); }
  else { show("ios", false); show("android", false); show("pc", true); }
})();
</script>
</body>
</html>
