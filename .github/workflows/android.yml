# Androidの配布用ファイル（AAB）をGitHub上で組み立てる。
#
# なぜクラウドで組むか：MacにもWindowsにもAndroid Studio（約10GB）が入っておらず、
# Macは空き容量にも余裕がないため。ここで組めば手元には何も入れなくてよい。
#
# 使い方：GitHubのActionsタブ →「Android AAB をビルド」→ Run workflow。
# 完成物は実行結果ページの Artifacts からダウンロードできる。
#
# 署名（2026-09-16）：GitHub の Secrets に鍵を入れてある。
#   KAKIAPP_KEYSTORE_B64      … アップロード鍵 kakigawatei-upload.jks を base64 にしたもの
#   KAKIAPP_KEYSTORE_PASSWORD … その鍵のパスワード（alias も同じパスワード）
#   Secrets が無いときは従来どおり未署名で組む。
#   鍵の実体は Mac ~/.android/ と Windows C:\Users\masat\.android\ の2か所（リポジトリには置かない）。

name: Android AAB をビルド

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 依存をインストール
        run: npm ci

      - name: www を作って Android に反映
        run: |
          node build-www.js
          npx cap sync android

      - name: 署名鍵を Secrets から復元（無ければ未署名）
        env:
          KS_B64: ${{ secrets.KAKIAPP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KAKIAPP_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "署名鍵あり: 署名付きで組みます"
          else
            echo "署名鍵なし: 未署名で組みます"
          fi

      - name: AAB を組み立てる
        env:
          KAKIAPP_KEYSTORE_PASSWORD: ${{ secrets.KAKIAPP_KEYSTORE_PASSWORD }}
          KAKIAPP_KEY_ALIAS: kakigawatei-upload
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: 動作確認用のAPKも作る
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kakiapp-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
